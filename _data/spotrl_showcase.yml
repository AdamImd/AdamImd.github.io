delivery:
  id: continuous-warehouse-film
  title: Spot rights and delivers a carton in one continuous simulation
  file: warehouse-delivery-continuous
  width: 1920
  height: 1080
  chapters: true
  duration: 1 min 13 s
  note: Righting at 1× speed · Remainder at 3.5×
  caption: Spot tips the carton onto its end, walks around it and sits to load it. After crossing the warehouse, Spot returns the carton to the floor and walks away.
  transcript: The camera opens on the warehouse. A carton lies broad-face down in front of Spot. Spot tips it upright using its forefoot and arm, walks around the carton, and lowers onto its rear shins. The gripper draws the carton against the deck. Spot rises with it braced on its back, takes the north route around the red fire lane, and lowers the carton into receiving bay B. The arm releases it. Spot stands and walks clear while the carton remains upright.
box:
  id: spot-box-tipping
  title: Learned box tipping
  file: box-tipping
  width: 1920
  height: 1080
  duration: 7 seconds
  note: 1080p · Selected successes · 1× speed
  caption: A learned policy tips the box. Three successful attempts, with episode resets retained.
  transcript: Spot reaches toward a yellow box with its arm and tips it onto its side. The scene resets between three successful tipping attempts. The studio render replays recorded simulator states from a saved policy.
crouch:
  id: spot-body-crouch
  title: Learned crouch with the arm stowed
  file: body-crouch
  width: 1920
  height: 1080
  duration: 26 seconds
  note: 1080p · Policy excerpt · 1× speed
  caption: Lowering toward a 24 cm body-height target, with the arm stowed.
  transcript: Spot bends its legs and lowers its body while its arm remains folded. A readout shows actual and target body height. The excerpt follows a descent from standing toward a 24-centimeter height target and the beginning of the low hold.
outtake:
  id: spot-box-outtake
  title: Box-tipping attempt that times out
  file: box-outtake
  width: 1920
  height: 1080
  duration: 15 seconds
  note: 1080p · Unsuccessful episode · 1× speed
  caption: The box wins this round. No stable tip before the timeout.
  transcript: Spot repeatedly reaches and adjusts its arm around the box. The box remains upright through the end of the saved episode. This attempt is unsuccessful and is included as an outtake.
